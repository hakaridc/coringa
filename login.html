<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GN</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-image: linear-gradient(to right, rgb(20, 147, 220), rgb(17, 54, 71));
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            color: white;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 15px;
            width: 320px;
        }

        fieldset {
            border: 3px solid dodgerblue;
            padding: 20px;
        }

        legend {
            border: 1px solid dodgerblue;
            padding: 10px 20px;
            text-align: center;
            background-color: dodgerblue;
            border-radius: 8px;
            font-weight: bold;
        }

        .inputBox {
            position: relative;
            margin-bottom: 30px;
        }

        .inputUser {
            background: none;
            border: none;
            border-bottom: 1px solid white;
            outline: none;
            color: white;
            font-size: 15px;
            width: 100%;
            letter-spacing: 1px;
            padding: 8px 0;
        }

        .labelInput {
            position: absolute;
            top: 8px;
            left: 0;
            pointer-events: none;
            transition: .5s;
            color: #ccc;
        }

        .inputUser:focus ~ .labelInput,
        .inputUser:valid ~ .labelInput {
            top: -18px;
            font-size: 12px;
            color: dodgerblue;
        }

        #submit {
            background-image: linear-gradient(to right, rgb(0, 92, 197), rgb(90, 20, 220));
            width: 100%;
            border: none;
            padding: 14px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        #submit:hover {
            background-image: linear-gradient(to right, rgb(0, 80, 172), rgb(80, 19, 195));
            transform: scale(1.02);
        }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .links a {
            color: #00bfff;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
     <header style="background-color: rgba(0, 0, 0, 0.4); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: absolute; top: 0; width: 100%; box-sizing: border-box;">
        <div style="font-size: 20px; font-weight: bold; color: white;">Meu Projeto</div>
       <nav>
           <a href="home.html" style="color: white; text-decoration: none; margin-left: 20px;">Home</a>
           <a href="cadastro.html" style="color: white; text-decoration: none; margin-left: 20px;">Cadastro</a>
           <a href="contato.html" style="color: white; text-decoration: none; margin-left: 20px;">Contato</a>
           <a href="Dashboard.html" style="color: white; text-decoration: none; margin-left: 20px;">Dashboard</a>
       </nav>
    </header>
    <div class="box">
        <form action="#">
            <fieldset>
                <legend>Login</legend>
                <br>

                <div class="inputBox">
                    <input type="email" name="email" id="email" class="inputUser" required>
                    <label for="email" class="labelInput">Email</label>
                </div>

                <div class="inputBox">
                    <input type="password" name="senha" id="senha" class="inputUser" required>
                    <label for="senha" class="labelInput">Senha</label>
                </div>

                <input type="submit" name="submit" id="submit" value="Entrar">

                <div class="links">
                    <p><a href="#">Esqueci minha senha</a></p>
                    <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
                </div>
            </fieldset>
        </form>
    </div>
</body>
</html>
