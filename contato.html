<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | GN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-image: linear-gradient(to right, rgb(20, 147, 220), rgb(17, 54, 71));
            min-height: 100vh;
            color: white;
        }

        header {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 22px;
            font-size: 15px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #00bfff;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 70px);
            padding: 40px 20px;
        }

        .box {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 35px;
            border-radius: 15px;
            width: 420px;
            border: 3px solid dodgerblue;
        }

        fieldset {
            border: none;
            padding: 0;
        }

        legend {
            background-color: dodgerblue;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 25px;
            display: inline-block;
        }

        .inputBox {
            position: relative;
            margin-bottom: 30px;
        }

        .inputUser {
            background: none;
            border: none;
            border-bottom: 1px solid white;
            outline: none;
            color: white;
            font-size: 15px;
            width: 100%;
            padding: 8px 0;
        }

        .labelInput {
            position: absolute;
            top: 8px;
            left: 0;
            pointer-events: none;
            transition: 0.5s;
            color: #ccc;
        }

        .inputUser:focus ~ .labelInput,
        .inputUser:valid ~ .labelInput {
            top: -18px;
            font-size: 12px;
            color: dodgerblue;
        }

        textarea {
            background: none;
            border: 1px solid white;
            border-radius: 8px;
            color: white;
            width: 100%;
            height: 120px;
            padding: 12px;
            font-size: 15px;
            outline: none;
            resize: vertical;
            font-family: Arial, Helvetica, sans-serif;
        }

        textarea:focus {
            border-color: dodgerblue;
        }

        #submit {
            background-image: linear-gradient(to right, rgb(0, 92, 197), rgb(90, 20, 220));
            width: 100%;
            border: none;
            padding: 14px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 10px;
        }

        #submit:hover {
            background-image: linear-gradient(to right, rgb(0, 80, 172), rgb(80, 19, 195));
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Meu Projeto</div>
        <nav>
            <a href="home.html">Home</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="login.html">Login</a>
            <a href="Dashboard.html">Dashboard</a>
        </nav>
    </header>

    <div class="container">
        <div class="box">
            <form action="#">
                <fieldset>
                    <legend>Contato</legend>

                    <div class="inputBox">
                        <input type="text" name="nome" id="nome" class="inputUser" required>
                        <label for="nome" class="labelInput">Nome</label>
                    </div>

                    <div class="inputBox">
                        <input type="email" name="email" id="email" class="inputUser" required>
                        <label for="email" class="labelInput">Email</label>
                    </div>

                    <div style="margin-bottom: 20px;">
                        <label for="mensagem" style="display: block; margin-bottom: 8px; color: #ccc;">Mensagem</label>
                        <textarea name="mensagem" id="mensagem" required></textarea>
                    </div>

                    <input type="submit" id="submit" value="Enviar Mensagem">
                </fieldset>
            </form>
        </div>
    </div>

</body>
</html>
